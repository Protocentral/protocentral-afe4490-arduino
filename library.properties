name=ProtoCentral AFE4490 PPG and SpO2 boards library
version=1.4.0
author=ProtoCentral Electronics <support@protocentral.com>
maintainer=ProtoCentral Electronics <support@protocentral.com>
sentence=Driver for the TI AFE4490 and AFE4400 pulse-oximeter AFEs on the ProtoCentral AFE4490 Breakout and Shield.
paragraph=Reads red, IR and ambient PPG at 63 Hz to 5 kHz with data-ready interrupts, runtime control of LED current, TIA gain and timing, and LED / photodiode fault diagnostics. Includes optional SpO2 and heart-rate algorithms that fit on an Arduino Uno and work at any sample rate, a ProtoCentral OpenView streaming example, and the 1.x API for existing sketches. For research and education only - not a medical device.
category=Sensors
